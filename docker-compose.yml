version: "2"
services:
  goof:
    build: .
    container_name: goof
    environment:
      - DOCKER=1
      - MYSQL_HOST=goof-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-acme_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-changeme_user_password}
      - MYSQL_DATABASE=acme
    ports:
      - "3001:3001"
      - "9229:9229"
    links:
      - goof-mongo
    depends_on:
      - goof-mongo
  goof-mongo:
    container_name: goof-mongo
    image: mongo:3
    ports:
      - "127.0.0.1:27017:27017"
  good-mysql:
    container_name: goof-mysql
    image: mysql:5
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root_password}
      MYSQL_DATABASE: acme
      MYSQL_USER: ${MYSQL_USER:-acme_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme_user_password}
    ports:
      - "127.0.0.1:3306:3306"
