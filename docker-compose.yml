version: "2"
services:
  goof:
    build: .
    container_name: goof
    environment:
      - DOCKER=1
      - MONGODB_USERNAME=goof_user
      - MONGODB_PASSWORD=goof_password_change_in_production
      - MONGODB_DATABASE=express-todo
    ports:
      - "3001:3001"
      - "9229:9229"
    links:
      - goof-mongo
    depends_on:
      - goof-mongo
  goof-mongo:
    container_name: goof-mongo
    image: mongo:3
    environment:
      - MONGO_INITDB_ROOT_USERNAME=goof_user
      - MONGO_INITDB_ROOT_PASSWORD=goof_password_change_in_production
      - MONGO_INITDB_DATABASE=express-todo
  good-mysql:
    container_name: goof-mysql
    image: mysql:5
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: acme
    ports:
      - "3306:3306"
